apis:
- name: Ritten External API
  description: The Ritten External API is the public REST contract for Ritten integrating partners. It
    covers patients (create, read, patch, vitals, forms, relationships, attachments, external-id lookup),
    contacts, CRM cases in the admissions pipeline, programs, facilities, organizations, tasks, clinical
    encounters and encounter types, form definitions, insurance payers, users/teams and calendar events,
    plus a 17-operation insights family for census, admissions, discharges, average length of stay, care
    teams, attendance, event audit and form outcomes - most of which also export CSV via ?csv=true. Six
    webhook events cover patient admit/transfer/discharge/created and case created/status-update. Every
    request requires an OAuth 2.0 client_credentials bearer token and an X-Ritten-Tenant header identifying
    the clinic instance.
  humanURL: https://docs.ritten.io/
