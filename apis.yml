name: Ritten
description: >-
  Ritten is a cloud-based electronic medical record (EMR) and practice-management
  platform built specifically for behavioral health and substance-use treatment
  organizations — detox, residential, PHP/IOP, and outpatient providers. Its
  browser-based product covers clinical documentation (group and individual notes,
  AI-assisted charting), scheduling, revenue-cycle management (claims, billing,
  authorizations), a HIPAA-compliant patient portal, treatment planning, compliance
  tooling (audit trails, signature routing), and outcomes reporting. Ritten is built
  for HIPAA-regulated and 42 CFR Part 2 confidentiality requirements with role-based
  access controls and audit logs, and supports operational integrations for
  e-prescribing, labs, eligibility/billing clearinghouses, and telehealth. Ritten
  does not publish a public developer API or OpenAPI at this time. Backed by 8VC and
  Threshold Ventures; based in Philadelphia, PA.
