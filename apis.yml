name: Ritten
description: Ritten is a cloud-based electronic medical record (EMR), CRM and revenue-cycle platform built
  specifically for behavioral health and substance-use treatment organizations - detox, residential, PHP/IOP,
  and outpatient providers. Its browser-based product covers clinical documentation (group and individual
  notes, AI-assisted charting), scheduling, revenue-cycle management (claims, billing, authorizations),
  a HIPAA-compliant patient portal, treatment planning, compliance tooling (audit trails, signature routing),
  and outcomes reporting. Ritten publishes a public REST contract for integrating partners - the Ritten
  External API - documented with an OpenAPI 3.1.0 definition covering 56 paths, 71 operations and 93 schemas
  across patients, contacts, CRM cases, programs, facilities, organizations, tasks, encounters, forms,
  insurance payers, users and a 17-operation insights and reporting family, plus six webhook events. Authentication
  is OAuth 2.0 client_credentials with a required X-Ritten-Tenant header selecting the clinic instance;
  credentials are provisioned by Ritten to partners rather than self-service. Ritten is built for HIPAA-regulated
  and 42 CFR Part 2 confidentiality requirements with role-based access controls and audit logs, and supports
  operational integrations for e-prescribing, labs, eligibility/billing clearinghouses, and telehealth.
  Backed by 8VC and Threshold Ventures; based in Philadelphia, PA.
