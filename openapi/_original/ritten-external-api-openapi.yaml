          schema:
            type: boolean
            default: false
          description: Return as CSV file
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormOutcomesReport"
            text/csv:
              schema:
                type: string
        400:
          description: Invalid parameters (missing required fields or invalid format)
        401:
          description: Unauthorized

webhooks:
  patient.admit:
    post:
      tags:
        - webhooks
      description: A patient has been admitted to a clinic program
      requestBody:
        content:
          application/json:
            schema:
              properties:
                type:
                  type: string
                  description: The event type
                  example: patient.admit
                data:
                  type: object
                  properties:
                    patientId:
                      type: string
                      description: The ID of the patient
                      example: 182c2e54-3494-4b85-aba5-038cf539d5bf
                    programId:
                      type: string
                      description: The ID of the program the patient was admitted to
                      example: 9a5e64b0-0a73-4cb5-ab32-44fea16da4e1
      responses:
        200:
          description: 200 status indicates that the data was received successfully
  patient.transfer:
    post:
      tags:
        - webhooks
      description: A patient has been transferred from one program to another
      requestBody:
        content:
          application/json:
            schema:
              properties:
                type:
                  type: string
                  description: The event type
                  example: patient.transfer
                data:
                  type: object
                  properties:
                    patientId:
                      type: string
                      description: The ID of the patient
                      example: 182c2e54-3494-4b85-aba5-038cf539d5bf
                    fromProgramId:
                      type: string
                      description: The ID of the program the patient was transferred from
                      example: 9a5e64b0-0a73-4cb5-ab32-44fea16da4e1
                    toProgramId:
                      type: string
                      description: The ID of the program the patient was transferred to
                      example: 1eddacc4-26b1-4e65-bf34-897e3be577c1
      responses:
        200:
          description: 200 status indicates that the data was received successfully
  patient.discharge:
    post:
      tags:
        - webhooks
      description: A patient has been discharged from a clinic program
      requestBody:
        content:
          application/json:
            schema:
              properties:
                type:
                  type: string
                  description: The event type
                  example: patient.discharge
                data:
                  type: object
                  properties:
                    patientId:
                      type: string
                      description: The ID of the patient
                      example: 182c2e54-3494-4b85-aba5-038cf539d5bf
                    programId:
                      type: string
                      description: The ID of the program the patient was discharged from
                      example: 9a5e64b0-0a73-4cb5-ab32-44fea16da4e1
      responses:
        200:
          description: 200 status indicates that the data was received successfully
  case.status.update:
    post:
      tags:
        - webhooks
      description: The status of a case has been updated
      requestBody:
        content:
          application/json:
            schema:
              properties:
                type:
                  type: string
                  description: The event type
                  example: case.status.update
                data:
                  type: object
                  properties:
                    caseId:
                      type: string
                      description: The ID of the case
                      example: 182c2e54-3494-4b85-aba5-038cf539d5bf
                    personSeekingTreatmentId:
                      type: string
                      description: The ID of the person seeking treatment. Can be empty if there is no person seeking treatment associated with the case.
                      example: 9a5e64b0-0a73-4cb5-ab32-44fea16da4e1
                    fromStatus:
                      type: string
                      description: The previous status of the case
                      example: New
                    toStatus:
                      type: string
                      description: The new status of the case
                      example: Qualified
      responses:
        200:
          description: 200 status indicates that the data was received successfully
  case.created:
    post:
      tags:
        - webhooks
      description: A new case has been created
      requestBody:
        content:
          application/json:
            schema:
              properties:
                type:
                  type: string
                  description: The event type
                  example: case.created
                data:
                  type: object
                  properties:
                    caseId:
                      type: string
                      description: The ID of the case
                      example: 182c2e54-3494-4b85-aba5-038cf539d5bf
                    personSeekingTreatmentId:
                      type: string
                      description: The ID of the person seeking treatment. Can be empty if there is no person seeking treatment associated with the case.
                      example: 9a5e64b0-0a73-4cb5-ab32-44fea16da4e1
                    status:
                      type: string
                      description: The status of the case
                      example: New
      responses:
        200:
          description: 200 status indicates that the data was received successfully
  patient.created:
    post:
      tags:
        - webhooks
      description: A new patient has been created (MRN generated)
      requestBody:
        content:
          application/json:
            schema:
              properties:
                type:
                  type: string
                  description: The event type
                  example: patient.created
                data:
                  type: object
                  properties:
                    patientId:
                      type: string
                      description: The ID of the patient
                      example: 182c2e54-3494-4b85-aba5-038cf539d5bf
                    mrn:
                      type: string
                      description: The medical record number assigned to the patient
                      example: D31EBE
      responses:
        200:
          description: 200 status indicates that the data was received successfully

components:
  schemas:
    OAuthTokenRequest:
      type: object
      required:
        - grant_type
        - client_id
        - client_secret
        - audience
      properties:
        grant_type:
          type: string
          enum:
            - client_credentials
          description: OAuth 2.0 grant type. Must be `client_credentials`.
          example: client_credentials
        client_id:
          type: string
          description: Your Auth0 M2M client ID.
        client_secret:
          type: string
          format: password
          writeOnly: true
          description: Your Auth0 M2M client secret.
        audience:
          type: string
          description: |
            The audience for the requested token. Must equal the env-specific
            external-api audience (e.g. `https://external-api.ritten.io` in
            production, `https://external-api.beta.ritten.io` in beta).
          example: https://external-api.ritten.io
    OAuthTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: The access token to use as a `Bearer` token on subsequent API calls.
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Token lifetime in seconds (currently 86400 / 24h).
          example: 86400
        scope:
          type: string
          description: Space-separated list of granted scopes (may be empty).
    OAuthErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: |
            OAuth 2.0 error code. Common values: `invalid_request`,
            `unsupported_grant_type`, `invalid_audience`, `invalid_client`,
            `bad_gateway`, `rate_limit_exceeded`.
        error_description:
          type: string
          description: Human-readable explanation of the error.
    PostPatientVital:
      type: object
      additionalProperties: false
      required:
        - type
        - measurements
        - timestamp
      properties:
        type:
          type: string
          description: |
            Vital observation type. `height_weight` accepts either a height measurement, a weight measurement,
            or both in one observation for compatibility with Ritten's internal biometrics model.
          enum:
            - temperature
            - heart_rate
            - respiration_rate
            - oxygen_saturation
            - blood_pressure
            - glucose
            - blood_alcohol_concentration
            - height_weight
          example: heart_rate
        measurements:
          type: array
          minItems: 1
          maxItems: 2
          description: |
            Measurements for the observation. Omit `type` only when the observation has a single standard
            measurement. `blood_pressure` requires one `systolic` and one `diastolic` measurement.
            `height_weight` supports `height`, `weight`, or both. The maximum of 2 measurements covers
            composite observations such as blood pressure and height/weight.
          items:
            $ref: "#/components/schemas/PostPatientVitalMeasurement"
        timestamp:
          type: string
          format: date-time
          description: Time the vital was recorded.
          example: "2026-05-27T15:30:00Z"
    PostPatientVitalMeasurement:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        type:
          type: string
          description: |
            Measurement type. Optional for single-measurement vitals, where omitted values default to
            `standard`. Required for composite measurements: `blood_pressure` must include `systolic`
            and `diastolic`, and `height_weight` must use `height` or `weight`. Structural validation is
            enforced server-side.
            Expected units: `standard` temperature = °F, heart_rate and respiration_rate = bpm,
            oxygen_saturation and blood_alcohol_concentration = %, glucose = mg/dL,
            systolic/diastolic = mmHg, height = in, weight = lbs.
          enum:
            - standard
            - systolic
            - diastolic
            - height
            - weight
          example: standard
        value:
          type: number
          format: double
          description: Numeric measurement value in the documented unit for this observation and measurement type.
          example: 72
    AttendanceType:
      type: string
      description: Attendance status of an encounter. Defaults to Attended when omitted at creation.
      enum:
        - Attended
        - AttendedNotBillable
        - AbsentExcused
        - AbsentNotExcused
        - AbsentUnknown
        - AbsentBillable
    PostTaskBody:
      type: object
      additionalProperties: false
      description: |
        External create contract for tasks. The server assigns the id, timestamps and creator.
      required:
        - title
        - assigneeId
      example:
        title: "Call the pharmacy"
        assigneeId: "9a5e64b0-0a73-4cb5-ab32-44fea16da4e1"
        priority: "High"
        dueDate: "2024-01-31"
      properties:
        title:
          type: string
          description: Short summary of the task. Unstructured clinical free text; may contain PHI.
        description:
          type: string
          description: Optional detail. Unstructured clinical free text; may contain PHI. Markdown is rendered.
        assigneeId:
          type: string
          format: uuid
          description: The staff user to assign the task to. Must be an active staff user.
        priority:
          $ref: "#/components/schemas/TaskPriority"
        status:
          $ref: "#/components/schemas/TaskStatus"
        dueDate:
          type: string
          format: date
          description: Date the task is due.
          example: "2024-01-31"
    PatchTaskBody:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        External partial update contract for tasks. Only the fields present in the request are
        changed; omitted fields keep their stored value. At least one field must be set.
      example:
        status: "Complete"
      properties:
        title:
          type: string
          description: Short summary of the task. Unstructured clinical free text; may contain PHI.
        description:
          type: string
          description: Unstructured clinical free text; may contain PHI. Replaces any rich text the task carries.
        assigneeId:
          type: string
          format: uuid
          description: The staff user to assign the task to. Must be an active staff user.
        priority:
          $ref: "#/components/schemas/TaskPriority"
        status:
          $ref: "#/components/schemas/TaskStatus"
        dueDate:
          type: string
          format: date
          description: Date the task is due. Send an empty string to clear an existing due date.
          example: "2024-01-31"
    PostEncounterBody:
      type: object
      additionalProperties: false
      description: |
        External create contract for encounters. The server assigns the encounter ID and start time on create.
      required:
        - patientId
        - encounterTypeId
      example:
        patientId: "d3f2c9a1-8b47-4e0f-a2c9-53f7f0c1b2aa"
        encounterTypeId: "0b6a1f6e-2f9a-4c56-9d1c-6a3f6f9d2e11"
        attendanceType: "Attended"
      properties:
        patientId:
          type: string
          format: uuid
          description: ID of the patient to create the encounter for.
        encounterTypeId:
          type: string
          format: uuid
          description: ID of the encounter type to create the encounter from. Use `GET /encounter-types` to discover types.
        attendanceType:
          $ref: "#/components/schemas/AttendanceType"
    Encounter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        encounterTypeId:
          type: string
          format: uuid
          description: ID of the encounter type the encounter was created from.
        name:
          type: string
          description: Display name of the encounter type.
          example: Individual Therapy
        status:
          type: string
          description: Documentation status of the encounter. New encounters always start Empty.
          enum:
            - Empty
            - Incomplete
            - Complete
        startTime:
          type: string
          format: date-time
          description: Start time of the encounter (server time at creation).
          example: "2024-01-01T00:00:00Z"
        attendanceType:
          $ref: "#/components/schemas/AttendanceType"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
    EncounterType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name of the encounter type.
          example: Individual Therapy
        description:
          type: string
        isBillable:
          type: boolean
          description: Whether encounters of this type generate billing artifacts.
        isGroup:
          type: boolean
          description: Whether this type is used for group encounters.
        durationMinutes:
          anyOf:
            - type: integer
              format: int64
            - type: "null"
          description: Default duration in minutes, when configured.
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
    PostPatientForm:
      type: object
      additionalProperties: false
      required:
        - formDefinitionLabel
        - encounterId
      properties:
        formDefinitionLabel:
          type: string
          description: Label of the form definition to instantiate. Discover labels via `GET /forms/definitions`.
          example: phq9_intake_form
        encounterId:
          type: string
          format: uuid
          description: |
            Encounter (visit) to attach the form to. The encounter must already exist and belong to
            the patient — create the encounter before submitting form data.
        values:
          type: object
          additionalProperties: true
          description: |
            Flat map of field definition label to value. Value shapes are field-type specific (see the
            endpoint description). A JSON null clears the field. Omit to create an empty form.
          example:
            roobi_depression_phq9_q1: "2"
            reason_for_visit: referral
    PatientForm:
      type: object
      properties:
        formInstanceId:
          type: string
          format: uuid
        formDefinitionLabel:
          type: string
          example: phq9_intake_form
        patientId:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
          description: Encounter the form is attached to.
        createdAt:
          type: string
          format: date-time
        sections:
          type: array
          items:
            $ref: "#/components/schemas/PatientFormSection"
    PatientFormSection:
      type: object
      properties:
        sectionLabel:
          type: string
          example: roobi_depression_phq9
        title:
          type: string
          example: PHQ-9
        fields:
          type: array
          items:
            $ref: "#/components/schemas/PatientFormField"
    PatientFormField:
      type: object
      properties:
        fieldLabel:
          type: string
          example: roobi_depression_phq9_q1
        title:
          type: string
          description: The field's prompt text.
        type:
          type: string
          description: The field's type (e.g. text, date, single_choice_scale, grid_matrix_text).
          example: single_choice_scale
        value:
          description: The field's stored value; null when unset.
    ListCases:
      type: array
      items:
        $ref: "#/components/schemas/Case"
    ListTasks:
      type: object
      properties:
        meta:
          type: object
          properties:
            count:
              type: integer
              example: 1
            totalCount:
              type: integer
              example: 10
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
    TaskStatus:
      type: string
      enum:
        - New
        - Working
        - Complete
        - Won't Do
    TaskPriority:
      type: string
      enum:
        - Low
        - Medium
        - High
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "182c2e54-3494-4b85-aba5-038cf539d5bf"
        title:
          type: string
          example: "Call the pharmacy"
        description:
          type: string
          example: "Confirm the refill went through."
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          description: The user the task is assigned to, or null if unassigned.
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          example: "9a5e64b0-0a73-4cb5-ab32-44fea16da4e1"
        createdById:
          description: The user who created the task, or null if it was created by an automation.
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        patientId:
          description: The client the task is linked to, or null if it is not client-linked.
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        dueDate:
          description: The date the task is due, or null if it has no due date.
          anyOf:
            - type: string
              format: date
            - type: "null"
          example: "2024-01-31"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        updatedAt:
          description: When the task was last updated, or null if it has never been updated.
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          example: "2024-01-02T00:00:00Z"
        statusUpdatedAt:
          description: When the task's status last changed, or null if it has never changed.
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          example: "2024-01-02T00:00:00Z"
    ListFacilities:
      type: object
      properties:
        meta:
          type: object
          properties:
            count:
              type: integer
              example: 1
            totalCount:
              type: integer
              example: 10
        facilities:
          type: array
          items:
            $ref: "#/components/schemas/Facility"
    Facility:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          $ref: "#/components/schemas/Address"
        nationalProviderId:
          type: string
          description: National Provider Identifier (NPI)
        phone:
          type: string
          description: Primary facility phone number
          example: "+15555555555"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
    ListPrograms:
      type: object
      properties:
        meta:
          type: object
          properties:
            count:
              type: integer
              example: 1
            totalCount:
              type: integer
              example: 10
        programs:
          type: array
          items:
            $ref: "#/components/schemas/ClinicProgram"
    ClinicProgram:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 182c2e54-3494-4b85-aba5-038cf539d5bf
        name:
          type: string
          example: Residential
        facility:
          anyOf:
            - $ref: "#/components/schemas/ProgramFacility"
            - type: "null"
        programType:
          $ref: "#/components/schemas/ProgramType"
        levelOfCare:
          type: array
          items:
            $ref: "#/components/schemas/LevelOfCare"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
    ProgramFacility:
      type: object
      properties:
        id:
          type: string
          format: uuid
    ProgramType:
      type: string
      enum:
        - Clinical
        - Additional Service
    LevelOfCare:
      type: string
      enum:
        - Early Intervention (0.5)
        - Outpatient Services (1.0)
        - Long-Term Remission Monitoring (1.0)
        - Outpatient Therapy (1.5)
        - Medically Managed Outpatient (1.7)
        - IOP/PHP - General (2)
        - IOP (2.1)
        - HIOP (High-Intensity Outpatient) (2.5)
        - PHP (2.5)
        - Medically Managed Intensive Outpatient (2.7)
        - Residential - General (3)
        - Clinically Managed Low-Intensity Residential Services (3.1)
        - Clinically Managed Population-Specific High-Intensity Services (3.2)
        - Clinically Managed High-Intensity Residential Services (3.5)
        - Medically Monitored Intensive Inpatient Services (3.7)
        - Medically Managed Residential (3.7)
        - Medically Managed Intensive Inpatient Services (4)
        - Ambulatory Detox Without Extended Onsite Monitoring (I-D)
        - Ambulatory Detox With Extended Onsite Monitoring (II-D)
        - Clinically Managed Residential Detoxification (III.2-D)
        - Medically Monitored Inpatient Detoxification (III.7-D)
        - Medically Managed Intensive Inpatient Detoxification (IV-D)
        - Sober Living
        - Recovery Residence
        - Case Management
        - Monitoring / Drug Testing
        - Peer Support
        - Advisory Services
        - Medication Management
        - Other
        - Other - Clinical
        - Level 3 (3)
        - Significant Treatment (3)
        - Level 4 (4)
        - Level 5 (5)
    ListOrganizations:
      type: object
      properties:
        meta:
          type: object
          properties:
            count:
              type: integer
              example: 1
            totalCount:
              type: integer
              example: 10
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
    ListOrganizationMembers:
      type: object
      properties:
        meta:
          type: object
          properties:
            count:
              type: integer
              example: 1
            totalCount:
              type: integer
              example: 10
        members:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMember"
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Ritten Recovery Center
        typeId:
          type: string
          format: uuid
          description: Organization type ID.
        assignedUserId:
          type: string
          format: uuid
          description: User assigned to the organization, if any.
        website:
          type: string
          format: uri
          description: Organization website URL.
          example: "https://example.com"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
    OrganizationMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Organization-person relationship ID.
        personId:
          type: string
          format: uuid
        first:
          type: string
          example: Jane
        last:
          type: string
          example: Doe
    PostOrganizationBody:
      type: object
      additionalProperties: false
      required:
        - name
        - typeId
      properties:
        name:
          type: string
          description: Organization name.
          example: Ritten Recovery Center
        typeId:
          type: string
          format: uuid
          description: Organization type ID.
        email:
          type: string
          format: email
          description: Primary work email for the organization.
          example: admissions@example.com
        phone:
          type: string
          description: Primary work phone for the organization.
          example: "555-555-5555"
        website:
          type: string
          format: uri
          description: Organization website URL.
          example: "https://example.com"
        address:
          $ref: "#/components/schemas/PostOrganizationAddress"
        assignedUserId:
          type: string
          format: uuid
          description: User assigned to the organization.
        primaryContactId:
          type: string
          format: uuid
          description: Person to set as the organization's primary contact.
    PostOrganizationAddress:
      type: object
      properties:
        country:
          type: string
          example: US
        line:
          type: string
          description: Street address line 1.
          example: 123 Main St
        line2:
          type: string
          description: Street address line 2.
          example: Suite 100
        city:
          type: string
          example: New York
        region:
          type: string
          example: NY
        postalCode:
          type: string
          example: "10001"
        notes:
          type: string
          example: Main admissions office
    PostFacilityBody:
      type: object
      required:
        - name
        - nationalProviderId
        - phone
        - address
      properties:
        name:
          type: string
          description: Facility name.
          example: Ritten Recovery Center
        nationalProviderId:
          type: string
          description: National Provider Identifier (NPI)
          example: "1234567890"
        phone:
          type: string
          description: Primary facility phone number
          example: "555-555-5555"
        address:
          $ref: "#/components/schemas/PostFacilityAddress"
    PatchFacilityBody:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: Facility name. Leading and trailing whitespace is trimmed.
          example: Ritten Recovery Center
    PatchProgramBody:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Partial update body. At least one of name or facilityId must be provided.
        Omitted fields are left unchanged; programType and levelOfCare are not patchable.
      properties:
        name:
          type: string
          description: Program name. Leading and trailing whitespace is trimmed.
          example: Residential
        facilityId:
          type: string
          format: uuid
          description: Active facility ID to associate with the program.
    PostProgramBody:
      type: object
      additionalProperties: false
      description: |
        External create contract with a limited field set. Does not accept id; the server assigns the program ID on create.
      required:
        - name
        - programType
        - levelOfCare
      example:
        name: "Residential Treatment"
        programType: "Clinical"
        levelOfCare:
          - "Clinically Managed High-Intensity Residential Services (3.5)"
        facilityId: "182c2e54-3494-4b85-aba5-038cf539d5bf"
      properties:
        name:
          type: string
          description: Program name. Leading and trailing whitespace is trimmed.
          example: Residential
        facilityId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          description: Optional active facility ID to associate with the program.
        programType:
          $ref: "#/components/schemas/ProgramType"
        levelOfCare:
          type: array
          minItems: 1
          uniqueItems: true
          description: |
            Exact catalog level-of-care values. Entries must be unique and compatible with programType
            (Clinical programs require clinical LOCs; Additional Service programs require non-clinical LOCs).
          items:
            $ref: "#/components/schemas/LevelOfCare"
    PatchOrganizationBody:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Organization name. Leading and trailing whitespace is trimmed.
          example: Ritten Recovery Center
        typeId:
          type: string
          format: uuid
          description: Organization type ID.
        assignedUserId:
          type: string
          format: uuid
          description: User assigned to the organization.
        website:
          type: string
          format: uri
          description: Organization website URL.
          example: "https://example.com"
    PostFacilityAddress:
      type: object
      required:
        - line
      properties:
        country:
          type: string
          description: Country code or name. US variants (e.g., "US", "USA", "United States") are normalized to "US".
          example: US
        line:
          type: string
          description: Street address line 1.
          example: 123 Main St
        line2:
          type: string
          description: Street address line 2.
          example: Suite 100
        city:
          type: string
          example: New York
        region:
          type: string
          description: For US addresses, must be a valid 2-letter US state/territory code or recognizable state name.
          example: NY
        postalCode:
          type: string
          example: "10001"
        timezone:
          type: string
          description: IANA timezone identifier.
          example: America/New_York
    PostCaseBody:
      type: object
