        caseSizeCents:
          type: integer
          minimum: 0
          description: Case value in cents
          example: 10000
        potentialAdmitDate:
          type: string
          format: date-time
          description: Potential admission date (ISO 8601)
          example: "2024-01-01T00:00:00Z"
        followUpDate:
          type: string
          format: date-time
          description: Follow-up date (ISO 8601)
          example: "2024-01-15T00:00:00Z"
        potentialProgramIds:
          type: array
