    post:
      tags:
        - calendar
      summary: Create a new calendar event
      description: Create a new calendar event.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CalendarEventCore"
                - type: object
                  properties:
                    timezone:
                      type: string
                      example: America/New_York
                    encounterTemplateId:
                      type: [string, "null"]
                      example: null
                    reminderInterval:
                      $ref: "#/components/schemas/CalendarEventInterval"
                    notifyGuests:
                      type: boolean
                    guests:
                      type: array
                      items:
                        type: object
                        properties:
                          entityType:
                            type: string
                            enum:
                              - user
                              - patient
                              - clinic team
                              - group
                              - program
                              - care team
                          entityId:
                            type: string
                            example: f87e1b07-1d20-4c36-8c37-08600daf7322
      responses:
        200:
          description: success
          content:
